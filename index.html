// Prayer times engine (PrayTimes.org algorithm). Karachi method: Fajr 18°, Isha 18°, Asr Hanafi (factor 2).
const PT = (() => {
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const sin = d => Math.sin(rad(d)), cos = d => Math.cos(rad(d)), tan = d => Math.tan(rad(d));
  const asin = x => deg(Math.asin(x)), acos = x => deg(Math.acos(x)), atan2 = (y, x) => deg(Math.atan2(y, x));
  const acot = x => deg(Math.atan(1 / x));
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  function julian(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function sunPos(jd) {
    const D = jd - 2451545.0;
    const g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
    const L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360);
    const e = 23.439 - 0.00000036 * D;
    const RA = fix(atan2(cos(e) * sin(L), cos(L)) / 15, 24);
    return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - RA };
  }
  // returns hours (local, decimal) for y-m-d
  function times(y, m, d, lat = 24.8607, lng = 67.0011, tz = 5) {
    const jDate = julian(y, m, d) - lng / (15 * 24);
    const midDay = t => fix(12 - sunPos(jDate + t).eqt, 24);
    const angleTime = (angle, t, ccw) => {
      const decl = sunPos(jDate + t).decl, noon = midDay(t);
      const h = acos((-sin(angle) - sin(decl) * sin(lat)) / (cos(decl) * cos(lat))) / 15;
      return noon + (ccw ? -h : h);
    };
    const asrTime = (factor, t) => {
      const decl = sunPos(jDate + t).decl;
      return angleTime(-acot(factor + tan(Math.abs(lat - decl))), t);
    };
    let t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18, isha: 18 };
    for (let i = 0; i < 2; i++) {
      const p = {}; for (const k in t) p[k] = t[k] / 24;
      t = {
        fajr: angleTime(18, p.fajr, true),
        sunrise: angleTime(0.833, p.sunrise, true),
        dhuhr: midDay(p.dhuhr),
        asr: asrTime(2, p.asr),
        maghrib: angleTime(0.833, p.maghrib),
        isha: angleTime(18, p.isha),
      };
    }
    const adj = tz - lng / 15;
    for (const k in t) t[k] += adj;
    return t;
  }
  return { times };
})();

async function loadAr(id){const it=IMAP[id];if(!it||hasAr(it)||it.loading)return;it.loading=1;try{const j=await fetch('https://api.alquran.cloud/v1/ayah/'+it.ref+'/quran-uthmani').then(r=>r.json());let t=j.data.text;const[su,ay]=it.ref.split(':');

    if(R.hist[R.pos]===id&&!holding){anim='ar';render()}}catch(e){}it.loading=0}
function remGo(d){if(d<0){if(R.pos>0)R.pos--;else return false}else{if(R.pos<R.hist.length-1)R.pos++;else{R.hist.push(R.next&&IMAP[R.next]&&R.next!==R.hist[R.hist.length-1]?R.next:pick());R.next='';if(R.hist.length>60){R.hist=R.hist.slice(-60)}R.pos=R.hist.length-1}}persist();return true}
function remInit(){const d=dayKey(now_());if(!R.hist.length||R.day!==d){R.day=d;R.pos=R.hist.length-1;remGo(1)}loadAr(R.hist[R.pos]);if(!R.next||!IMAP[R.next]){R.next=pick();}loadAr(R.next)}
function toggleLike(){const it=IMAP[R.hist[R.pos]];if(!it)return;const on=!R.like[it.id];if(on)R.like[it.id]=1;else delete R.like[it.id];for(const t of it.tags)R.boost[t]=Math.max(0,(R.boost[t]||0)+(on?1:-1));persist();if(on)buzz(15);anim='heart';render()}
const HEART=on=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>`;
function remHtml(){const it=IMAP[R.hist[R.pos]]||ITEMS[0],c=AR[it.id],ar=it.ar||(c&&c.t)||'',label=it.label||('AYAH · '+(c?c.n.toUpperCase()+' ':'')+it.ref),al=ar.length,ul=it.ur.length,liked=!!R.like[it.id];
  const afs=al>260?19:al>170?22:al>100?26:30,ufs=ul>230?18:ul>150?21:25;
  return`<div class="in">${ptop(5,'')}<button data-act="rem" aria-label="Tap left for previous, right for next" class="rm${anim==='rem'?' sw':''}" style="flex:1;min-height:0;padding:0 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;width:100%"><div style="font-size:11px;letter-spacing:3px;color:var(--mute)">${label}</div><div lang="ar" dir="rtl" class="${anim==='ar'?'sw':''}" style="font-family:'Amiri','Geeza Pro',serif;font-size:${afs}px;line-height:1.9;min-height:${afs*1.9}px">${ar||'<span style="color:var(--dim);letter-spacing:6px">· · ·</span>'}</div><div style="width:28px;height:1px;background:var(--dim)"></div><div style="font-family:'Instrument Serif',Georgia,serif;font-size:${ufs}px;line-height:1.4">${it.ur}</div></button>
  <div style="display:flex;justify-content:center"><button data-act="heart" aria-label="${liked?'Unlike':'Like'}" aria-pressed="${liked}" class="ic${anim==='heart'&&liked?' hpop':''}" style="color:${liked?'var(--ink)':'var(--dim)'}">${HEART(liked)}</button></div></div>`}
function setHtml(now,today){const w=win(today),th=S.cfg.theme||'auto';
  return`<div class="in" style="justify-content:flex-start;gap:28px;height:auto;min-height:100%"><div class="top"><span class="lab">SETTINGS</span><button data-act="setx" style="min-height:44px;font-size:11px;letter-spacing:3px;color:var(--mute)">CLOSE</button></div>
  <div class="col" style="gap:10px"><div class="lab">THEME</div><div class="seg">${['auto','light','dark'].map(t=>`<button data-th="${t}" class="${th===t?'on':''}">${t.toUpperCase()}</button>`).join('')}</div></div>
  <div class="col" style="gap:6px"><div class="lab">PRAYER TIMES · KARACHI · HANAFI</div>${P.map(p=>`<div class="adj"><b>${NM[p]}</b><button data-off="${p}" data-d="-1" aria-label="Earlier">−</button><span>${clock(w[p][0])}</span><button data-off="${p}" data-d="1" aria-label="Later">+</button></div>`).join('')}</div>
  <div style="font-size:11px;letter-spacing:1px;color:var(--dim)">${S.api?(S.q.length?'SYNC PENDING · '+S.q.length:'SYNCED'):'SAVED ON THIS PHONE ONLY'}</div></div>`}
function applyTheme(){const t=S.cfg.theme||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content',getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#000')}
function render(forceR){if(holding)return;const now=now_(),today=dayKey(now);if(!recapDay||recapDay>today)recapDay=today;
  $('#home').innerHTML=homeHtml(now,today,forceR===true);const pg=$('#pg'),x=pg.scrollLeft;
  pg.innerHTML=[weekHtml(now,today),questsHtml(now,today),byHtml(now,today),chainHtml(now),`<div class="in">${ptop(4,'')}${recapHtml(recapDay,now,false)}</div>`,remHtml()].map(h=>`<div class="pgp">${h}</div>`).join('');pg.scrollLeft=x;fx();
  if($('#set').classList.contains('on')){const st_=$('#set').scrollTop;$('#set').innerHTML=setHtml(now,today);$('#set').scrollTop=st_}flashP=null;anim=''}
let fxq=0,snapT=0;
function fx(){fxq=0;const v=$('#v'),p=Math.min(1,v.scrollTop/(v.clientHeight||1)),h=$('#home .in');
  if(h)h.style.opacity=String(Math.max(0,1-p*1.4));
  $('#sh').style.opacity=String(Math.max(0,Math.min(1,p*2-1)));
  const pg=$('#pg'),x=pg.scrollLeft/(pg.clientWidth||1);
  document.querySelectorAll('#pd i').forEach((e,i)=>{const a=Math.max(0,1-Math.abs(i-x));e.style.width=(6+12*a)+'px';e.style.opacity=String(.28+.72*a)})}
function settle(){const v=$('#v'),H=v.clientHeight||1,t=Math.round(v.scrollTop/H)*H;if(Math.abs(v.scrollTop-t)>1)v.scrollTo({top:t,behavior:'smooth'})}
function onScroll(){lastScroll=performance.now();if(!fxq)fxq=requestAnimationFrame(fx);clearTimeout(snapT);snapT=setTimeout(settle,140)}
$('#pg').addEventListener('scroll',onScroll,{passive:true});$('#v').addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{settle();fx()});
function fadeThen(sel_,key,fn){const e=document.querySelector(sel_);if(e)e.classList.add('out');setTimeout(()=>{fn();anim=key;render()},e?170:0)}
// ---------- events ----------
let hraf=0,hstart=0;
function holdStart(e){const b=e.target.closest('#hold');if(!b||b.disabled)return;e.preventDefault();const now=now_(),today=dayKey(now),last=sum(today,now).n===4;const dur=last?2500:1500;holding=true;hstart=performance.now();b.classList.add('dn');buzz(10);
  const hp=$('#hp');(function tick(t){const f=Math.min(1,(t-hstart)/dur);hp.setAttribute('stroke-dashoffset',(100*(1-f)).toFixed(1));if(f>=1){holding=false;hraf=0;logHold();return}hraf=requestAnimationFrame(tick)})(hstart)}
function holdEnd(){if(!holding)return;cancelAnimationFrame(hraf);holding=false;const b=$('#hold');if(b){b.classList.remove('dn');$('#hp').setAttribute('stroke-dashoffset','100')}}
document.addEventListener('pointerdown',holdStart);['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,holdEnd));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-sel],[data-ch],[data-undo],[data-day],[data-th],[data-off]');if(!t)return;const d=t.dataset,now=now_(),today=dayKey(now);
  if(d.ch)return choose(d.ch);
  if(d.undo)return undo(d.undo);
  if(d.sel){if(choice)return;sel=sel===d.sel&&!forceRing?null:d.sel;if(st(today,d.sel,now)==='U'&&!rec(today,d.sel))sel=null;forceRing=!!sel&&(!!rec(today,'isha')||now>=win(today).recapAt);$('#v').scrollTo({top:0,behavior:'smooth'});return render()}
  if(d.day){if(d.day===recapDay&&!recapWeek)return;return fadeThen('.pgp .rb','recap',()=>{recapDay=d.day;recapWeek=false})}
  if(d.th){S.cfg.theme=d.th;persist();applyTheme();return render()}
  if(d.off){S.cfg.off[d.off]=(S.cfg.off[d.off]||0)+Number(d.d);wc={};persist();return render()}
  const a=d.act;
  if(a==='down')$('#v').scrollTo({top:$('#stats').offsetTop,behavior:'smooth'});
  else if(a==='up')$('#v').scrollTo({top:0,behavior:'smooth'});
  else if(a==='week')fadeThen('.pgp .rb','recap',()=>{recapWeek=!recapWeek})
  else if(a==='rem'){const r=t.getBoundingClientRect(),dir=e.clientX<r.left+r.width/2?-1:1;if(dir<0&&R.pos===0)return;fadeThen('.rm','rem',()=>{remGo(dir);loadAr(R.hist[R.pos]);if(dir>0&&R.pos===R.hist.length-1){R.next=pick();loadAr(R.next)}})}
  else if(a==='heart')toggleLike()
  else if(a==='set'){render();$('#set').innerHTML=setHtml(now,today);$('#set').scrollTop=0;requestAnimationFrame(()=>$('#set').classList.add('on'))}
  else if(a==='setx'){$('#set').classList.remove('on')}
});
applyTheme();remInit();render();pull();flush();
setInterval(()=>{if(!choice&&performance.now()-lastScroll>1500&&!$('#fx').classList.contains('on'))render()},15000);
const rdy=()=>document.body.classList.add('rdy');(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(rdy);setTimeout(rdy,1200);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sel=null;forceRing=false;remInit();render();pull();flush()}});
</script>
</body>
